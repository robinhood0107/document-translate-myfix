name: PR metadata contract

on:
  pull_request:
    branches:
      - main
      - develop
      - benchmarking/lab
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  validate-pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 고정
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 고정
        with:
          python-version: "3.12"

      - name: Validate pull request issue and evidence fields
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/validate_pr_report_contract.py

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-main-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version tag and app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only semantic version tags like vX.Y.Z are supported."
            exit 1
          fi
          version="${tag#v}"
          app_version="$(python -c 'from pathlib import Path; ns = {}; exec(Path("app/version.py").read_text(encoding="utf-8"), ns); print(ns["__version__"])')"
          if [[ "$version" != "$app_version" ]]; then
            echo "::error::Tag version $version does not match app/version.py $app_version."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure tagged commit is contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Release tags are allowed only for commits already contained in origin/main."
            exit 1
          fi

  build-windows-launcher-source-release:
    runs-on: windows-latest
    needs: verify-main-tag
    env:
      APP_VERSION: ${{ needs.verify-main-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deterministic launcher-source bundle
        shell: pwsh
        run: |
          python scripts/build_windows_launcher_source_bundle.py build `
            --version "$env:APP_VERSION" `
            --commit "$env:GITHUB_SHA" `
            --output-dir build/release

      - name: Verify bundle manifest and checksum
        shell: pwsh
        run: |
          python scripts/build_windows_launcher_source_bundle.py verify `
            --archive "build/release/comic-translate-v$env:APP_VERSION-windows-launcher-source.zip" `
            --checksums "build/release/SHA256SUMS.txt" `
            --expected-version "$env:APP_VERSION" `
            --expected-commit "$env:GITHUB_SHA"

      - name: Verify extracted launchers without installing
        shell: pwsh
        run: |
          $extractDir = "build/release/extracted"
          Expand-Archive `
            -Path "build/release/comic-translate-v$env:APP_VERSION-windows-launcher-source.zip" `
            -DestinationPath $extractDir
          $bundleRoot = Join-Path $extractDir "comic-translate-v$env:APP_VERSION-windows-launcher-source"
          $env:COMIC_VERIFY_ONLY = "1"
          Push-Location $bundleRoot
          try {
            & cmd.exe /d /c "call run_comic.bat"
            if ($LASTEXITCODE -ne 0) { throw "CUDA 12 launcher-source contract failed." }
            & cmd.exe /d /c "call run_comic_cuda13.bat"
            if ($LASTEXITCODE -ne 0) { throw "CUDA 13 launcher-source contract failed." }
          } finally {
            Pop-Location
          }

      - name: Upload launcher-source GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/comic-translate-v${{ needs.verify-main-tag.outputs.version }}-windows-launcher-source.zip
            build/release/SHA256SUMS.txt

name: CI report publisher

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ci-report-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 고정
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 고정
        with:
          python-version: "3.12"

      - name: Download only the workflow evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 고정
        with:
          name: ci-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: incoming-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}

      - name: Validate and upsert the sanitized PR comment
        env:
          REPORT_PATH: incoming-evidence/workflow-report.json
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          EXPECTED_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/workflow_evidence.py publish
          --report "$REPORT_PATH"
          --event pull_request
          --base-ref "$BASE_REF"
          --expected-sha "$EXPECTED_SHA"
          --workflow-conclusion "$WORKFLOW_CONCLUSION"
          --repository "$REPOSITORY"
          --pull-request-number "$PR_NUMBER"

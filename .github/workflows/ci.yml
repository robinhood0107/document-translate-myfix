name: CI

on:
  push:
    branches:
      - main
      - develop
      - "benchmarking/lab"
  pull_request:
    branches:
      - main
      - develop
      - "benchmarking/lab"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming policy
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          branch="$REF_NAME"
          if [[ "$branch" == "main" || "$branch" == "develop" ]]; then
            exit 0
          fi
          if [[ "$branch" == "benchmarking/lab" ]]; then
            exit 0
          fi
          if [[ "$branch" =~ ^(feature|fix|chore|hotfix)/[a-z0-9][a-z0-9._-]*$ ]]; then
            exit 0
          fi
          echo "::error::Invalid branch name: $branch"
          exit 1

  windows-launcher-contract:
    runs-on: windows-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Parse Windows bootstrap scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/bootstrap_windows.ps1",
            "scripts/lib/WindowsBootstrap.psm1",
            "scripts/lib/ManagedRuntimeDocker.psm1",
            "scripts/lib/ManagedRuntimeModelSource.psm1",
            "scripts/prepare_gemma_runtime.ps1",
            "scripts/prepare_hunyuanocr_llamacpp_runtime.ps1",
            "scripts/prepare_paddleocr_llamacpp_runtime.ps1",
            "scripts/prepare_paddleocr_spotting_llamacpp_runtime.ps1",
            "scripts/prepare_mangalmm_llamacpp_runtime.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file failed PowerShell parsing: $($errors -join '; ')"
            }
          }

      - name: Verify launcher source contracts without installation
        shell: pwsh
        run: |
          $env:COMIC_VERIFY_ONLY = "1"
          $env:COMIC_NO_PAUSE = "1"
          $launchers = @(
            "run_comic.bat", "run_comic_cuda13.bat",
            "setup.bat", "setup_cuda13.bat",
            "setup_full.bat", "setup_full_cuda13.bat"
          )
          foreach ($launcher in $launchers) {
            cmd.exe /d /c "call .\$launcher"
            if ($LASTEXITCODE -ne 0) { throw "$launcher source contract failed." }
          }

  validate-pr-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate pull request branch flow
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/validate_pr_flow.py --head "$HEAD_REF" --base "$BASE_REF"

  validate-instruction-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate instruction-harness synchronization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_instruction_sync.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

  validate-commit-attribution:
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate new commit attribution
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/validate_commit_attribution.py \
              --range "$BASE_SHA..$HEAD_SHA"
          else
            python scripts/validate_commit_attribution.py \
              --push-before "$BEFORE_SHA" \
              --push-after "$HEAD_SHA" \
              --branch "$REF_NAME"
          fi

  validate-main-docs:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate main docs allowlist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_main_docs_policy.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

  validate:
    runs-on: ubuntu-latest
    needs: branch-name
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libdbus-1-3 \
            libfontconfig1 \
            libglib2.0-0 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade \
            pip==26.0.1 \
            wheel==0.46.3 \
            setuptools==80.9.0
          python -m pip install -r requirements-cuda12.txt

      - name: Validate repo policy
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: python scripts/validate_repo_policy.py --mode ci --branch "$REF_NAME"

      - name: Validate Python syntax
        run: python scripts/validate_changed_python.py --all

      - name: Headless smoke test
        run: python scripts/headless_smoke.py

      - name: Validate translations
        run: python scripts/compile_translations.py --check

  quality:
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 고정
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 고정
        with:
          python-version: "3.12"

      - name: Install pinned quality and contract-test tools
        run: python -m pip install -r requirements-quality.txt

      - name: Lint changed Python source
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/validate_changed_ruff.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          else
            python scripts/validate_changed_ruff.py --before-sha "$BEFORE_SHA" --head-sha "$HEAD_SHA"
          fi

      - name: Validate reporting and metadata contracts
        run: >-
          python -m pytest -q
          tests/test_validation_artifact_harness.py
          tests/test_workflow_evidence.py
          tests/test_validate_pr_report_contract.py
          tests/test_validate_changed_ruff.py
          tests/test_validate_pr_flow.py
          tests/test_validate_main_docs_policy.py
          tests/test_workflow_required_checks.py

  report-guard:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - branch-name
      - windows-launcher-contract
      - validate-pr-flow
      - validate-instruction-sync
      - validate-commit-attribution
      - validate-main-docs
      - validate
      - quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 고정

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 고정
        with:
          python-version: "3.12"

      - name: Generate private, sanitized workflow evidence
        id: collect
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/workflow_evidence.py collect

      - name: Record sanitized report in job summary
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REPORT_PATH: banchmark_result_log/managed-runs/80-pr-governance/ci-workflow-report/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/workflow-report.json
        run: |
          if [[ "$COLLECT_OUTCOME" != "success" ]]; then
            printf '## CI evidence unavailable\n\nThe sanitized workflow report could not be finalized.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            python scripts/workflow_evidence.py summary \
              --report "$REPORT_PATH" \
              --event "$EVENT_NAME" \
              --base-ref "$BASE_REF"
          fi

      - name: Upload sanitized workflow report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 고정
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            banchmark_result_log/managed-runs/80-pr-governance/ci-workflow-report/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/workflow-report.json
            banchmark_result_log/managed-runs/80-pr-governance/ci-workflow-report/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/workflow-report.md
          if-no-files-found: error
          retention-days: 14

      - name: Require completed and valid workflow report
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_PATH: banchmark_result_log/managed-runs/80-pr-governance/ci-workflow-report/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/workflow-report.json
          REPORT_MARKDOWN_PATH: banchmark_result_log/managed-runs/80-pr-governance/ci-workflow-report/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/workflow-report.md
        run: |
          set -euo pipefail
          if [[ "$COLLECT_OUTCOME" != "success" ]]; then
            echo "::error::Sanitized workflow report collection or finalization failed."
            exit 1
          fi
          test -s "$REPORT_PATH"
          test -s "$REPORT_MARKDOWN_PATH"
          python scripts/workflow_evidence.py validate \
            --report "$REPORT_PATH" \
            --event "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --expected-sha "$EXPECTED_SHA"

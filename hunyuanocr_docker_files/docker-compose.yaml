services:
  hunyuanocr-local-server:
    image: ${HUNYUAN_OCR_LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda13}
    pull_policy: missing
    container_name: hunyuanocr-local-server
    restart: unless-stopped
    labels:
      com.comictranslate.hunyuanocr-runtime-fingerprint: "${HUNYUAN_OCR_RUNTIME_FINGERPRINT:-unprepared}"
      com.comictranslate.hunyuanocr-model-volume: "${HUNYUAN_OCR_MODEL_VOLUME:-comic-translate-hunyuanocr-models-v2}"
      com.comictranslate.hunyuanocr-ready-manifest-sha256: "${HUNYUAN_OCR_READY_MANIFEST_SHA256:-unprepared}"
      com.comictranslate.hunyuanocr-model-sha256: "${HUNYUAN_OCR_MODEL_SHA256:-unprepared}"
      com.comictranslate.hunyuanocr-mmproj-sha256: "${HUNYUAN_OCR_MMPROJ_SHA256:-unprepared}"
    ports:
      - "127.0.0.1:28080:8080"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hunyuanocr-models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    command:
      - -m
      - /models/${HUNYUAN_OCR_MODEL_FILE:-HunyuanOCR.Q8_0.gguf}
      - --mmproj
      - /models/${HUNYUAN_OCR_MMPROJ_FILE:-HunyuanOCR.mmproj-Q8_0.gguf}
      - --alias
      - ${HUNYUAN_OCR_MODEL_ALIAS:-HunyuanOCR.Q8_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${HUNYUAN_OCR_LLAMA_CTX_SIZE:-4096}"
      - -np
      - "${HUNYUAN_OCR_LLAMA_PARALLEL:-1}"
      - -t
      - "${HUNYUAN_OCR_LLAMA_THREADS:-12}"
      - --cache-ram
      - "0"
      - --n-gpu-layers
      - "${HUNYUAN_OCR_LLAMA_GPU_LAYERS:-80}"
      - --image-max-tokens
      - "${HUNYUAN_OCR_LLAMA_IMAGE_MAX_TOKENS:-1024}"

volumes:
  hunyuanocr-models:
    external: true
    name: ${HUNYUAN_OCR_MODEL_VOLUME:-comic-translate-hunyuanocr-models-v2}

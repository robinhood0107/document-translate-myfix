services:
  paddleocr-llamacpp:
    image: ${PADDLEOCR_LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:22e0e3bfe967af4fd1df6a918022abbfd4e72e4d40a4769e616a4176790acbcb}
    pull_policy: missing
    container_name: paddleocr-llamacpp
    restart: unless-stopped
    labels:
      com.comictranslate.paddleocr-runtime-fingerprint: "${PADDLEOCR_RUNTIME_FINGERPRINT:-unprepared}"
      com.comictranslate.paddleocr-model-volume: "${PADDLEOCR_LLAMA_MODEL_VOLUME:-comic-translate-paddleocr-vl-llamacpp-models-v1}"
      com.comictranslate.paddleocr-ready-manifest-sha256: "${PADDLEOCR_READY_MANIFEST_SHA256:-unprepared}"
      com.comictranslate.paddleocr-model-sha256: "${PADDLEOCR_MODEL_SHA256:-unprepared}"
      com.comictranslate.paddleocr-mmproj-sha256: "${PADDLEOCR_MMPROJ_SHA256:-unprepared}"
      com.comictranslate.paddleocr-preparation-version: "${PADDLEOCR_PREPARATION_VERSION:-0}"
    volumes:
      - paddleocr-llamacpp-models:/models:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    ports:
      - "127.0.0.1:18000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    command:
      - -m
      - /models/${PADDLEOCR_LLAMA_MODEL_FILE:-PaddleOCR-VL-1.6-GGUF.gguf}
      - --mmproj
      - /models/${PADDLEOCR_LLAMA_MMPROJ_FILE:-PaddleOCR-VL-1.6-GGUF-mmproj.gguf}
      - --alias
      - ${PADDLEOCR_LLAMA_MODEL_ALIAS:-PaddleOCR-VL-1.6-0.9B}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${PADDLEOCR_LLAMA_CTX_SIZE:-4096}"
      - -np
      - "${PADDLEOCR_LLAMA_PARALLEL:-1}"
      - -t
      - "${PADDLEOCR_LLAMA_THREADS:-10}"
      - -b
      - "${PADDLEOCR_LLAMA_BATCH_SIZE:-2048}"
      - -ub
      - "${PADDLEOCR_LLAMA_UBATCH_SIZE:-512}"
      - --n-gpu-layers
      - "${PADDLEOCR_LLAMA_GPU_LAYERS:-all}"
      - --fit
      - "off"
      - --flash-attn
      - "on"
      - --temp
      - "0"
      - --metrics
      - --sleep-idle-seconds
      - "${PADDLEOCR_LLAMA_SLEEP_IDLE_SECONDS:-5}"

volumes:
  paddleocr-llamacpp-models:
    external: true
    name: ${PADDLEOCR_LLAMA_MODEL_VOLUME:-comic-translate-paddleocr-vl-llamacpp-models-v1}

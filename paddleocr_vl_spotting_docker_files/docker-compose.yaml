services:
  paddleocr-spotting-llamacpp:
    image: ${PADDLEOCR_SPOTTING_LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    pull_policy: never
    container_name: paddleocr-spotting-llamacpp
    restart: unless-stopped
    labels:
      com.comictranslate.paddleocr-spotting-runtime-fingerprint: "${PADDLEOCR_SPOTTING_RUNTIME_FINGERPRINT:-unprepared}"
      com.comictranslate.paddleocr-spotting-model-volume: "${PADDLEOCR_SPOTTING_MODEL_VOLUME:-comic-translate-paddleocr-vl-spotting-llamacpp-models-v2}"
      com.comictranslate.paddleocr-spotting-ready-manifest-sha256: "${PADDLEOCR_SPOTTING_READY_MANIFEST_SHA256:-unprepared}"
      com.comictranslate.paddleocr-spotting-model-sha256: "${PADDLEOCR_SPOTTING_MODEL_SHA256:-unprepared}"
      com.comictranslate.paddleocr-spotting-mmproj-sha256: "${PADDLEOCR_SPOTTING_MMPROJ_SHA256:-unprepared}"
      com.comictranslate.paddleocr-spotting-preparation-version: "${PADDLEOCR_SPOTTING_PREPARATION_VERSION:-0}"
    volumes:
      - paddleocr-spotting-models:/models:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    ports:
      - "127.0.0.1:18002:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    command:
      - -m
      - /models/${PADDLEOCR_SPOTTING_MODEL_FILE:-PaddleOCR-VL-1.6-Spotting-GGUF.gguf}
      - --mmproj
      - /models/${PADDLEOCR_SPOTTING_MMPROJ_FILE:-PaddleOCR-VL-1.6-Spotting-mmproj.gguf}
      - --alias
      - ${PADDLEOCR_SPOTTING_MODEL_ALIAS:-PaddleOCR-VL-1.6-Spotting}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${PADDLEOCR_SPOTTING_LLAMA_CTX_SIZE:-4096}"
      - -np
      - "${PADDLEOCR_SPOTTING_LLAMA_PARALLEL:-1}"
      - -t
      - "${PADDLEOCR_SPOTTING_LLAMA_THREADS:-10}"
      - -b
      - "${PADDLEOCR_SPOTTING_LLAMA_BATCH_SIZE:-2048}"
      - -ub
      - "${PADDLEOCR_SPOTTING_LLAMA_UBATCH_SIZE:-512}"
      - --n-gpu-layers
      - "${PADDLEOCR_SPOTTING_LLAMA_GPU_LAYERS:-all}"
      - --fit
      - "off"
      - --flash-attn
      - "on"
      - --temp
      - "0"
      - --special
      - --metrics
      - --sleep-idle-seconds
      - "${PADDLEOCR_SPOTTING_LLAMA_SLEEP_IDLE_SECONDS:-5}"

volumes:
  paddleocr-spotting-models:
    external: true
    name: ${PADDLEOCR_SPOTTING_MODEL_VOLUME:-comic-translate-paddleocr-vl-spotting-llamacpp-models-v2}
